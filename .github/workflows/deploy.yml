name: Deploy a VPS (negocios.directoriocomercial.acacias.gov.co)

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VPS_HOST: 88.99.61.43
      VPS_PORT: 52847
      VPS_USER: user_dir_covps
      VPS_PATH: /home/user_dir_covps/domains/negocios.directoriocomercial.acacias.gov.co/app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: Install PHP dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & build frontend assets
        run: |
          npm ci
          npm run build

      - name: Deploy files via rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete --exclude=".git*" --exclude="node_modules" --exclude=".env" --exclude="storage"
          path: ./
          remote_path: ${{ env.VPS_PATH }}/
          remote_host: ${{ env.VPS_HOST }}
          remote_port: ${{ env.VPS_PORT }}
          remote_user: ${{ env.VPS_USER }}
          remote_key: ${{ secrets.VPS_SSH_KEY }}

      - name: Run post-deploy commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.VPS_HOST }}
          port: ${{ env.VPS_PORT }}
          username: ${{ env.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ${{ env.VPS_PATH }}
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
